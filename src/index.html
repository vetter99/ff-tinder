<!doctype html>
<html lang="en" class="bg-zinc-950">
  <head>
    <meta charset="utf-8" />
    <title>Trade Bait</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Swipe to teach it how you value players; get personalized, market-fair fantasy football trade ideas." />
    <meta name="theme-color" content="#f1f5f9" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved look before first paint (see ThemeService). "system" follows the device.
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('trade-bait:theme') || 'system';
        } catch (e) {}
        if (pref === 'book') pref = 'light'; // earlier name
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#020617' : '#f1f5f9';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Trade Bait" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <app-root></app-root>
  </body>
</html>
